name: 依存の確認
on:
  pull_request:
    branches: [develop, master]
permissions:
  contents: read
jobs:
  dependency-review:
    name: 入ってくる依存を見る
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
