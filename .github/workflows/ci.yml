# Questionnaire の CI を C# と画面アセットの構成へ合わせたもの。
name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: "{} の省略が無いか検査する"
        run: npm run lint:ts
      - run: npm run lint:md
      - name: ロック済み依存を復元する
        run: dotnet restore --locked-mode
      - name: ビルドする
        run: dotnet build --no-restore -c Release
      - name: テストする
        run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
      - name: 配布物を作成する
        id: package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: 配布物を残す
        uses: actions/upload-artifact@v7
        with:
          name: McpOAuthWrapper
          path: ${{ steps.package.outputs.directory }}/
          if-no-files-found: error
          retention-days: 30
      - name: テスト結果を残す
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: テスト結果
          path: TestResults/*.trx
          if-no-files-found: warn
  instructions:
    name: instructions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - run: bash scripts/sync-agents.sh --check
      - run: bash scripts/test-sync-reference.sh
      - run: bash scripts/reference-isolation-check.sh
  kvs-tests:
    name: kvs-tests / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - name: Valkey
            image: valkey/valkey:9.1.2
            cli: valkey-cli
          - name: Redis
            image: redis:8.2
            cli: redis-cli
    services:
      kvs:
        image: ${{ matrix.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "${{ matrix.cli }} ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MCP_TEST_KVS_CONNECTION: localhost:6379
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build --no-restore -c Release
  database-tests:
    name: database-tests / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SQLServer
            dbms: SQLServer
            image: mcr.microsoft.com/mssql/server:2025-CU8-ubuntu-24.04
            port: 1433
          - name: PostgreSQL
            dbms: PostgreSQL
            image: postgres:17
            port: 5432
          - name: MySQL
            dbms: MySQL
            image: mysql:8.4
            port: 3306
    services:
      database:
        image: ${{ matrix.image }}
        ports:
          - 127.0.0.1:${{ matrix.port }}:${{ matrix.port }}
        # 使わない変数は各イメージが無視する。値は CI 専用のダミーで、Secrets は使わない。
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Vv1!ci0dummy0admin0password
          POSTGRES_PASSWORD: Vv1!ci0dummy0admin0password
          POSTGRES_DB: smoke
          MYSQL_ROOT_PASSWORD: Vv1!ci0dummy0admin0password
          MYSQL_DATABASE: smoke
          MYSQL_ROOT_HOST: '%'
    env:
      SMOKE_ADMIN_PASSWORD: Vv1!ci0dummy0admin0password
      SMOKE_READER_PASSWORD: Vv2!ci0dummy0reader0password
      SMOKE_PORT: ${{ matrix.port }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: ロック済み依存を復元する
        run: dotnet restore _development/tests/database-smoke/DatabaseSmoke.csproj --locked-mode
      - name: 検証プログラムをビルドする
        run: dotnet build _development/tests/database-smoke/DatabaseSmoke.csproj --no-restore -c Release
      - name: 実 DB で検証する（起動待ちは検証プログラムが 60 秒まで行う）
        run: dotnet _development/tests/database-smoke/bin/Release/net10.0/DatabaseSmoke.dll ${{ matrix.dbms }}
